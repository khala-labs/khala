# 개발 편의 오버레이 — `docker compose up -d` 시 자동 병합된다.
# .env에서 시크릿/경로를 읽는다 (.env.example 참고).
# 목적: (1) Ollama 임베딩 모델 자동 pull, (2) 대상 코드 마운트,
#       (3) 로컬 dev 웹 온램프 — NEXUS_DEV_TOKEN 주입(웹이 자동 Bearer 사용, INTERNAL local-dev principal),
#       (4) 엔진이 컨테이너를 내려도 저절로 돌아오기 — 아래 `restart` 들.
# 앱이 쓰는 시크릿(NOTION_TOKEN·ANTHROPIC_API_KEY)은 여기가 아니라 베이스 compose 에 있다 —
# 오버레이는 얹고 빼는 것이라, 여기 적은 자격증명은 그 오버레이를 안 얹는 배포에서 사라진다.
# ⚠️ 이 오버레이는 *로컬 전용*이다. prod 에 쓰지 말 것(NEXUS_DEV_TOKEN 은 INTERNAL 코퍼스 접근을 연다).
services:
  # ── Ollama 임베딩 모델 자동 pull (한 번 실행 후 종료) ──
  nexus-ollama-init:
    image: ollama/ollama:0.40.16
    container_name: nexus-ollama-init
    depends_on:
      nexus-ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://nexus-ollama:11434   # CLI가 메인 ollama 서버를 타겟
    entrypoint:
      - /bin/sh
      - -c
      - "until ollama list >/dev/null 2>&1; do echo 'waiting for ollama...'; sleep 2; done; ollama pull nomic-embed-text"
    restart: "no"

  # ── 엔진이 내려도 저절로 돌아온다 ──
  # 2026-10-14 · 10-16 에 Docker 엔진이 컨테이너를 한꺼번에 255 로 내렸고, 그때 돌아온 것은
  # `restart` 가 붙은 재적재 잡 하나였다. 나머지는 사람이 알아챌 때까지(4.5시간 · 하루 가까이) 꺼져 있었고,
  # 그동안 재적재는 사이드카에 못 닿아 매시 건너뛰었다. 슬랙 봇과 재적재가 상시 도는 로컬
  # 배포라 prod 오버레이와 같은 정책을 둔다. `docker stop` 으로 멈춘 것은 그대로 멈춰 있다.
  nexus-db:
    restart: unless-stopped

  nexus-embed:
    restart: unless-stopped

  nexus-ollama:
    restart: unless-stopped

  nexus-slack:
    restart: unless-stopped

  # ── 앱: 로컬 dev 웹 토큰 주입 + 대상 코드 마운트 ──
  nexus-app:
    restart: unless-stopped
    environment:
      # 로컬 dev 웹 온램프용 고정 토큰(.env 로 덮어쓰기 가능). 설정 시 앱이 INTERNAL local-dev
      # principal 을 등록하고 웹이 /auth/dev-token 으로 받아 자동 사용한다. 리포 config 는 불변.
      NEXUS_DEV_TOKEN: ${NEXUS_DEV_TOKEN:-nexus-local-dev}
      # local-dev 의 읽기 범위. `env_file` 로만 들어오면 셸 값으로 덮어쓸 수 없어서(compose 에서
      # `env_file` 은 보간이 아니라 파일 그대로다) 새 테넌트를 한 번 시험하려 해도 `.env` 를
      # 고쳐야 했다. 보간으로 받으면 셸 값 > `.env` 순서가 된다. 비면 범위 선언 없음(= 자기 테넌트
      # 하나)으로 앱이 읽는다 — 변수가 없을 때와 같다. 절차는 `.env.example` 의 이 변수 옆.
      NEXUS_DEV_READ_TENANTS: ${NEXUS_DEV_READ_TENANTS:-}
      # local-dev 하나의 답변 백엔드(`auth/config.py`). 비면 프로세스 기본값을 따른다.
      NEXUS_DEV_LLM_PROVIDER: ${NEXUS_DEV_LLM_PROVIDER:-}
      NEXUS_DEV_CLEARANCE_VERIFIED: ${NEXUS_DEV_CLEARANCE_VERIFIED:-}
    volumes:
      # CODE_SRC_PATH 미설정 시 placeholder(./docs)로 폴백해 compose 에러 방지.
      # 코드 상수 해석을 쓰려면 .env에 CODE_SRC_PATH 설정 → config code_source.repo_path: /code-src
      - ${CODE_SRC_PATH:-./docs}:/code-src:ro
      # 리포 **밖의 문서 코퍼스**를 적재할 때 여는 문. `/code-src` 와 같은 모양·같은 이유로
      # 읽기 전용이다 — 적재는 읽는 일이고, 쓰기 권한을 주면 남의 리포를 고칠 수 있게 된다.
      #
      # ⚠ **적재는 반드시 컨테이너 안에서 돈다.** 임베딩 세대가 env 로 오고 그 env 는 여기만
      # 있어서, 호스트 셸의 `nexus ingest` 는 config 기본값(768/nomic)으로 해석해 **검색되지
      # 않는 컬럼**에 넣는다. 2026-08-10 에 실제로 그렇게 됐다.
      - ${INGEST_SRC_PATH:-./docs}:/ingest-src:ro
